[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "islands-tools"
version = "0.4.2"
requires-python = ">=3.12"
dependencies = ["pyyaml"]

[tool.setuptools]
packages = ["common", "env", "copyrighter", "make", "verify", "graphs"]

[tool.islands]
engine = "0.3"
suites = ["tests/make", "tests/copyrighter", "tests/verify"]
